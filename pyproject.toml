[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aioecam"
version = "0.1.0b4"
description = "Async local-first client for De'Longhi ECAM coffee machines (Coffee Link / Ayla LAN mode)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christoph Berliner" }]
keywords = ["delonghi", "coffee", "ecam", "ayla", "home-assistant", "asyncio"]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
    "cryptography>=44",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[project.urls]
Source = "https://github.com/Styx85/aioecam"
Issues = "https://github.com/Styx85/aioecam/issues"
"Protocol notes" = "https://github.com/Styx85/cremalink-ha/blob/main/docs/ecam-lan-protocol.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aioecam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# Explicit per-call timeouts are part of the public API (friendlier for Home Assistant).
ignore = ["ASYNC109"]

[tool.mypy]
strict = true
packages = ["aioecam"]
mypy_path = "src"

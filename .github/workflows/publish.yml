name: Publish to PyPI

# Runs only for a published GitHub release. Uploads use PyPI Trusted Publishing
# (OIDC): there is no API token anywhere. PyPI trusts exactly this workflow file
# in Styx85/aioecam, running in the "pypi" environment.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "release tag $TAG does not match pyproject version $version" >&2
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - name: Test the built wheel
        run: |
          python -m pip install "$(ls dist/*.whl)" pytest pytest-asyncio
          python -m pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aioecam/
    permissions:
      id-token: write  # OIDC for Trusted Publishing; the only elevated permission
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
